name: Acquisition frontend promotion (explicit approval only)

on:
  workflow_dispatch:
    inputs:
      review_package:
        description: Approved review package artifact path
        required: true
        type: string
      approval_reference:
        description: Trusted moderator approval reference
        required: true
        type: string
      selected_record_ids:
        description: Comma-separated approved POI record IDs
        required: true
        type: string
      action:
        description: Promote or rollback an exact package
        required: true
        type: choice
        options: [promote, rollback]
      package_id:
        description: Exact package ID for rollback
        required: false
        type: string
      review_run_id:
        description: Optional Actions run ID that produced the uploaded review artifact
        required: false
        type: string
      active_package_id:
        description: Exact active package ID for rollback
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: acquisition-frontend-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: acquisition-moderated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve review package path
        shell: bash
        env:
          REVIEW_INPUT: ${{ inputs.review_package }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$REVIEW_RUN_ID" ]; then
            mkdir -p promotion-artifacts/imported-review
            gh run download "$REVIEW_RUN_ID" --name acquisition-review-package --dir promotion-artifacts/imported-review
            REVIEW_PATH=$(find promotion-artifacts/imported-review -type f -name '*.json' -print -quit)
            test -n "$REVIEW_PATH"
          else
            REVIEW_PATH="$REVIEW_INPUT"
          fi
          test -n "$REVIEW_PATH"
          echo "REVIEW_PATH=$REVIEW_PATH" >> "$GITHUB_ENV"
      - name: Verify package approval through Supabase RLS boundary
        if: inputs.action == 'promote'
        shell: bash
        env:
          REVIEW: ${{ env.REVIEW_PATH }}
          APPROVAL: ${{ inputs.approval_reference }}
          IDS: ${{ inputs.selected_record_ids }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_URL" -a -n "$SUPABASE_SECRET_KEY"
          PACKAGE_ID=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["packageId"])' "$REVIEW")
          RESPONSE=$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            "$SUPABASE_URL/rest/v1/acquisition_package_approvals?package_id=eq.${PACKAGE_ID}&approved=eq.true&select=package_id,approved,approval_reference")
          echo "$RESPONSE" | jq -e --arg package "$PACKAGE_ID" --arg reference "$APPROVAL" 'length == 1 and .[0].package_id == $package and .[0].approved == true and .[0].approval_reference == $reference' >/dev/null
          SELECTIONS=$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            "$SUPABASE_URL/rest/v1/acquisition_package_selections?package_id=eq.${PACKAGE_ID}&selected=eq.true&select=record_id")
          echo "$SELECTIONS" | jq -e --arg ids "$IDS" '([.[].record_id] | sort) == ($ids | split(",") | map(select(length > 0)) | sort)' >/dev/null
      - name: Run explicit frontend promotion or rollback
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          REVIEW: ${{ env.REVIEW_PATH }}
          APPROVAL: ${{ inputs.approval_reference }}
          IDS: ${{ inputs.selected_record_ids }}
          PACKAGE: ${{ inputs.package_id }}
          ACTIVE: ${{ inputs.active_package_id }}
        run: |
          python -m compileall -q gremlin_acquisition
          if [ "$ACTION" = "rollback" ]; then
            python -m gremlin_acquisition.frontend_release --action rollback --package-id "$PACKAGE" --active-package-id "$ACTIVE" --publish-dir motherbird/data/acquisition-packages
          else
            IFS=',' read -r -a RECORD_IDS <<< "$IDS"
            ARGS=()
            for id in "${RECORD_IDS[@]}"; do ARGS+=(--selected-record-id "$id"); done
            python -m gremlin_acquisition.frontend_release --action promote --review-package "$REVIEW" --approval-reference "$APPROVAL" --publish-dir motherbird/data/acquisition-packages "${ARGS[@]}"
          fi
      - name: Publish the exact approved package manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motherbird/data/acquisition-packages promotion-artifacts
          if git diff --cached --quiet; then
            echo "No publication change; promotion was idempotent."
          else
            git commit -m "Publish approved acquisition package"
            git push
          fi
