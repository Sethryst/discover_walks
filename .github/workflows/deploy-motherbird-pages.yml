name: Deploy Motherbird to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Pages should converge on the newest repository state; older queued builds
  # must not hold the current review artifact behind stale deployments.
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motherbird/package-lock.json

      - name: Install Motherbird dependencies
        working-directory: motherbird
        run: npm ci

      - name: Verify Motherbird runtime and KPI contracts
        working-directory: motherbird
        run: |
          npm test -- --runInBand
          npm run test:storage-contract
          node --test tests/kpi-index.test.mjs

      - name: Build Motherbird
        working-directory: motherbird
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built Motherbird site
        uses: actions/upload-pages-artifact@v3
        with:
          path: motherbird/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Playwright browser
        working-directory: motherbird
        run: npx playwright install --with-deps chromium

      - name: Run deployed fresh-browser canary
        working-directory: motherbird
        env:
          MOTHERBIRD_SMOKE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:pages-smoke

      - name: Verify deployed cache identity
        working-directory: motherbird
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run verify:deployed-build -- "${{ steps.deployment.outputs.page_url }}"

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: motherbird-deployment-diagnostics
          path: |
            motherbird/test-results/
            motherbird/playwright-report/
          if-no-files-found: ignore
