name: Keep Supabase project active

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */8 * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the RLS-protected profile endpoint
        run: node motherbird/tools/supabase-heartbeat.mjs
