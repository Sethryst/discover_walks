name: Refresh and publish biodiversity sidecars

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: write

concurrency:
  group: biodiversity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motherbird/package-lock.json

      - name: Install Motherbird dependencies
        working-directory: motherbird
        run: npm ci

      - name: Fetch eligible regional occurrence sidecars
        working-directory: motherbird
        run: npm run refresh:biodiversity

      - name: Run biodiversity safeguards and contract tests
        working-directory: motherbird
        run: |
          npm run check:biodiversity:release
          npm run test:biodiversity
          npm run audit:imports

      - name: Build and smoke-test Pages output
        working-directory: motherbird
        run: |
          npm run build
          npm run test:pages-smoke

      - name: Commit refreshed static artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No biodiversity changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motherbird/data motherbird/js/biodiversity-registry.js motherbird/regions motherbird/tools motherbird/package.json
          git commit -m "Refresh biodiversity regional sidecars"
          git push origin HEAD:main

      - name: Upload refresh diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: biodiversity-refresh-diagnostics
          path: |
            motherbird/test-results/
            motherbird/playwright-report/
