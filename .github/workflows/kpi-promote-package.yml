name: Promote Mother Bird package

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: Repository path to the reviewed package JSON
        required: true
        type: string
      selected_record_ids:
        description: Comma-separated stable record IDs to include
        required: true
        type: string
      approval_reference:
        description: Authenticated Supabase approval reference
        required: true
        type: string
      action:
        description: Validate a candidate or explicitly publish it
        required: true
        default: validate
        type: choice
        options: [validate, publish]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate selected package
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
          SELECTED_IDS: ${{ inputs.selected_record_ids }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          ACTION: ${{ inputs.action }}
        run: |
          python scripts/promote_motherbird_package.py \
            --package "$PACKAGE_PATH" \
            --selected "$SELECTED_IDS" \
            --approval-reference "$APPROVAL_REFERENCE" \
            --action "$ACTION"
      - name: Commit explicit publication
        if: inputs.action == 'publish'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add promotion-artifacts/published
          git commit -m "Publish approved Mother Bird package" || echo "No publication changes"
          git push
      - name: Upload candidate or publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: motherbird-${{ inputs.action }}-package
          path: ${{ inputs.action == 'publish' && 'motherbird/data/acquisition-packages/*.json' || 'promotion-artifacts/candidates/*.json' }}
          if-no-files-found: error
