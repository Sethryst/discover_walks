name: Acquisition promotion (explicit approval only)

on:
  workflow_dispatch:
    inputs:
      package:
        description: Content-addressed package path produced by review
        required: true
        type: string
      action:
        description: Validate or publish; routine acquisition never publishes
        required: true
        type: choice
        options: [validate, publish, rollback]
      report:
        description: Reviewed promotion report path (validate/publish only)
        required: false
        type: string
      selected_event_ids:
        description: Comma-separated event IDs explicitly selected by moderator
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: acquisition-promotion
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    environment: acquisition-moderated
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected package and tests
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          ACTION: ${{ inputs.action }}
          SELECTED_IDS: ${{ inputs.selected_event_ids }}
        run: |
          python -m compileall -q gremlin_acquisition
          if [ "$ACTION" = rollback ]; then
            python -m gremlin_acquisition.release --action rollback --package-id "$PACKAGE" --active-package-id "$PACKAGE" --audit promotion-artifacts/audit.jsonl
          else
            test -f "$PACKAGE"
            test -n "${{ inputs.report }}"
            IFS=',' read -r -a IDS <<< "$SELECTED_IDS"
            ARGS=()
            for id in "${IDS[@]}"; do ARGS+=(--selected-event-id "$id"); done
            python -m gremlin_acquisition.release --action "$ACTION" --report "${{ inputs.report }}" --output-dir promotion-artifacts/packages "${ARGS[@]}"
          fi
          echo "Publication requires this protected environment approval and explicit selected event IDs."
