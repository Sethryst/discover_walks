name: acquisition-replay
on:
  workflow_dispatch:
  pull_request:
    paths: ["gremlin_acquisition/**", "tests/test_acquisition_engine.py", "tests/test_replay.py", "fixtures/acquisition/**"]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -U pytest
      - name: Run acquisition lifecycle and Portland replay tests
        run: pytest -q tests/test_acquisition_engine.py tests/test_replay.py
